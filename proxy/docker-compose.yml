version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - nexus-network
    environment:
      - HANDSHAKE_SECRET_TOKEN=${HANDSHAKE_SECRET_TOKEN:?Set HANDSHAKE_SECRET_TOKEN}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - backend
      - opa
    environment:
      - BACKEND_HOST=backend:8081
      - HANDSHAKE_SECRET_TOKEN=${HANDSHAKE_SECRET_TOKEN:?Set HANDSHAKE_SECRET_TOKEN}
      - SECURITY_ADMIN_TOKEN=${SECURITY_ADMIN_TOKEN:?Set SECURITY_ADMIN_TOKEN}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
    ports:
      - "8080:8080"
    networks:
      - nexus-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  opa:
    image: ${OPA_IMAGE:?Set OPA_IMAGE to a pinned OPA image tag or digest}
    expose:
      - "8181"
    networks:
      - nexus-network
    volumes:
      - ./policies:/policies:ro
    command:
      - "run"
      - "--server"
      - "--addr=:8181"
      - "--diagnostic-addr=:8182"
      - "/policies"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  nexus-network:
    driver: bridge
