version: '3.8'

services:
  proxy:
    build: ..
    ports:
      - "8080:8080"
    networks:
      - nexus-network
    depends_on:
      - opa
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  opa:
    image: openpolicyagent/opa:latest
    ports:
      - "8181:8181"
    networks:
      - nexus-network
    command:
      - "run"
      - "--server"
      - "--addr=:8181"
      - "--diagnostic-addr=:8182"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  nexus-network:
    driver: bridge